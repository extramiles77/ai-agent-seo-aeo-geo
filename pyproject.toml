[project]
name = "ai-agent-seo"
version = "3.1.0"
description = "Comprehensive SEO analysis skill for Claude Code"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
  {name = "extramiles77"}
]
keywords = ["seo", "claude-code", "ai-tools", "schema-markup", "e-e-a-t", "geo"]


[project.urls]
Homepage = "https://github.com/extramiles77/ai-agent-seo-aeo-geo"
Repository = "https://github.com/extramiles77/ai-agent-seo-aeo-geo"
Issues = "https://github.com/extramiles77/ai-agent-seo-aeo-geo/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
